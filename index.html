<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Net Worth</title>
<style>
:root{--bg:#05060a;--card:#0d0f16;--c2:#151824;--bd:#1d2130;--tx:#f2f4fa;--mut:#7d869c;--ac:#7c5cff;--ac2:#22d3ee;--pos:#34d399;--neg:#fb7185;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 14px 130px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.brand{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);padding:6px 12px;border-radius:9px;font:inherit;font-weight:600}
.seg button.on{background:linear-gradient(135deg,var(--ac),#5b8cff);color:#fff}
.fx{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:12px}.fx input{width:68px;padding:6px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:radial-gradient(120% 140% at 0 0,#2b1d70 0%,#0d0f16 62%);border-color:#2a2350}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 12px;font-weight:700}
h3{margin:0 0 14px;font-size:18px}
.big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.mut{color:var(--mut);font-size:13px}.pos{color:var(--pos)}.neg{color:var(--neg)}.sp{display:flex;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.tile b{display:block;font-size:16px;margin-top:2px}
.r{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.r:first-of-type{border-top:0}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--bd)}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.g{flex:1;min-width:0}.g .mut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt{text-align:right}
.ib{width:40px;height:40px;border:0;border-radius:12px;background:var(--c2);color:var(--mut);font-size:16px;flex:none}
.ib:active{background:var(--bd)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
.bar{height:7px;border-radius:4px;background:var(--c2);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:4px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--mut);padding:7px 13px;border-radius:20px;font:inherit;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--c2);color:var(--tx);font:inherit;font-size:16px}
.btn{padding:13px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--ac),#5b8cff);color:#fff;font:inherit;font-weight:700}
.btn.g{background:var(--c2);border:1px solid var(--bd);color:var(--tx)}.btn.d{background:var(--neg);color:#1a0a0e}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.donut svg{width:150px;height:150px;flex:none}.leg{flex:1;min-width:160px}
.ch{width:100%;height:120px;margin-top:10px}
.mb{display:flex;gap:10px;height:120px;align-items:flex-end}.mb>div{flex:1;text-align:center}
.mb .p{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:96px}.mb .p i{width:13px;border-radius:5px 5px 0 0;min-height:2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:#0a0b11ee;backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;padding:4px}nav button span{display:block;font-size:20px}
nav button.on{color:var(--ac2)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:30px;box-shadow:0 8px 24px #7c5cff55}
.sh{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}.sh.on{display:flex}
.sh>div{width:100%;max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.ts{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--neg);color:#1a0a0e;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:30}.ts.on{opacity:1}
</style></head><body><main><div id="app"></div></main>
<nav id="nav"></nav><button class="fab" id="fab" onclick="tab==='Cash flow'?ts():hs()" aria-label="Add">+</button>
<div class="sh" id="sh" onclick="if(event.target===this)closeSheet()"><div id="shc"></div></div><div class="ts" id="ts"></div>
<script>
const CATS=['Crypto','NFTs','US stocks','Greek stocks','Commodities','Cash'];
const ACCS=['Freedom24','Phantom','Jupiter','OKX','Revolut','Alpha Bank','Piraeus Bank','Other'];
const TC=['Food','Transport','Bills','Shopping','Fun','Health','Salary','Other'];
const CC={Crypto:'#f59e0b',NFTs:'#ec4899','US stocks':'#7c5cff','Greek stocks':'#22d3ee',Commodities:'#facc15',Cash:'#34d399'};
const COL=['#7c5cff','#22d3ee','#f59e0b','#ec4899','#34d399','#fb7185','#60a5fa','#a3e635'];
const ICON={Overview:'📊',Assets:'💼','Cash flow':'💸',Connect:'🔌'};
const KEY='networth-v1';
let S={h:[],t:[],s:[],fx:0.9,disp:'EUR'},tab='Overview',flt='All',E=null,cb=null;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.h.forEach(h=>{h.id=h.id||uid();h.cur=h.cur||'EUR'});
const today=()=>new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=()=>S.disp==='USD';
const eur=n=>{const v=D()?n/S.fx:n;return (v<0?'-':'')+(D()?'$':'€')+Math.abs(v).toLocaleString('en',{maximumFractionDigits:0})};
const sym=c=>c==='USD'?'$':'€';
const toE=(a,c)=>c==='USD'?a*S.fx:a;
const val=h=>toE(h.q*h.p,h.cur);
const tv=x=>toE(x.a,x.cur);
const num=n=>(+n).toLocaleString('en',{maximumFractionDigits:4});
const total=()=>S.h.reduce((a,h)=>a+val(h),0);
const opts=(a,s)=>a.map(x=>`<option${x===s?' selected':''}>${x}</option>`).join('');
function uid(){return Math.random().toString(36).slice(2,9)}
function save(){
  const d=today(),v=total(),i=S.s.findIndex(x=>x.d===d);
  if(S.h.length){if(i>=0)S.s[i].v=v;else S.s.push({d,v})}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  render();
}
function sheet(h){$('shc').innerHTML=h;$('sh').className='sh on'}
function closeSheet(){$('sh').className='sh'}
function toast(t){const e=$('ts');e.textContent=t;e.className='ts on';setTimeout(()=>e.className='ts',2400)}
function ask(t,f){cb=f;sheet(`<h3>${t}</h3><div class="f"><button class="btn g" onclick="closeSheet()">Cancel</button><button class="btn d" onclick="closeSheet();cb()">Delete</button></div>`)}
function group(a,f){const m={};a.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+val(x)});return Object.entries(m).map(([k,v])=>({k,v})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v)}
function donut(it,cf){
  const T=it.reduce((a,x)=>a+x.v,0);let off=25;
  const seg=it.map((x,i)=>{const p=x.v/T*100,c=cf(x,i);const s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${c}" stroke-width="5" stroke-dasharray="${Math.max(p-.8,.1)} ${100-p+.8}" stroke-dashoffset="${off}"/>`;off-=p;return s}).join('');
  const leg=it.map((x,i)=>`<div class="row"><span><span class="dot" style="background:${cf(x,i)}"></span>${esc(x.k)}</span><span><b>${(x.v/T*100).toFixed(0)}%</b> <span class="mut">${eur(x.v)}</span></span></div>`).join('');
  return `<div class="donut"><svg viewBox="0 0 42 42">${seg}<text x="21" y="22.5" text-anchor="middle" fill="#f2f4fa" font-size="4.6" font-weight="800">${eur(T)}</text></svg><div class="leg">${leg}</div></div>`;
}
function line(){
  if(S.s.length<2)return '<p class="mut">Your history chart builds up as you open the app on different days.</p>';
  const a=S.s.slice(-90),W=320,H=110,mn=Math.min(...a.map(x=>x.v)),mx=Math.max(...a.map(x=>x.v)),r=(mx-mn)||1;
  const l=a.map((x,i)=>(i/(a.length-1)*W).toFixed(1)+','+(H-10-(x.v-mn)/r*(H-24)).toFixed(1)).join(' L');
  return `<svg viewBox="0 0 ${W} ${H}" class="ch" preserveAspectRatio="none"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".5"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></linearGradient></defs><path d="M0,${H} L${l} L${W},${H}Z" fill="url(#gg)"/><path d="M${l}" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><div class="mut sp"><span>${a[0].d}</span><span>${a[a.length-1].d}</span></div>`;
}
const av=h=>`<div class="av" style="background:${CC[h.c]}22;color:${CC[h.c]}">${esc(h.n.slice(0,3).toUpperCase())}</div>`;
const tile=(l,v,c)=>`<div class="tile"><span class="mut">${l}</span><b class="${c||''}">${v}</b></div>`;
function head(){return `<header><div><span class="brand">Net Worth</span><div class="mut" id="st" style="font-size:11px">${window.ST||(window.refresh?'':'Manual prices')}</div></div><div style="display:flex;gap:8px;align-items:center"><label class="fx">$1=€<input type="number" step="0.0001" value="${S.fx}" onchange="S.fx=parseFloat(this.value)||S.fx;save()"></label><div class="seg"><button class="${D()?'':'on'}" onclick="S.disp='EUR';save()">€</button><button class="${D()?'on':''}" onclick="S.disp='USD';save()">$</button></div></div></header>`}
const V={
Overview(){
  if(!S.h.length)return `<div class="card hero"><h2>Welcome</h2><p>Add your first asset with the + button to see your net worth, allocation and history.</p><button class="btn" onclick="hs()">Add asset</button> <button class="btn g" onclick="sample()">Load sample data</button></div>`;
  const T=total(),f=S.s[0],ch=f?T-f.v:0,cash=S.h.filter(h=>h.c==='Cash').reduce((a,h)=>a+val(h),0),top=[...S.h].sort((a,b)=>val(b)-val(a)).slice(0,5);
  const cm=today().slice(0,7),mi=S.t.filter(x=>x.d.startsWith(cm)&&x.ty==='in').reduce((a,x)=>a+tv(x),0),mo=S.t.filter(x=>x.d.startsWith(cm)&&x.ty==='out').reduce((a,x)=>a+tv(x),0);
  return `<div class="card hero"><h2>Total net worth</h2><div class="big">${eur(T)}</div>${S.s.length>1?`<div class="${ch>=0?'pos':'neg'}">${ch>=0?'▲':'▼'} ${eur(Math.abs(ch))} (${f.v?(ch/f.v*100).toFixed(1):0}%) since ${f.d}</div>`:'<div class="mut">Tracking started today</div>'}${line()}</div>
  <div class="tiles">${tile('Invested',eur(T-cash))}${tile('Cash',eur(cash))}${tile('Month net',(mi-mo>=0?'+':'')+eur(mi-mo),mi-mo>=0?'pos':'neg')}</div>
  <div class="card"><h2>Allocation</h2>${donut(group(S.h,h=>h.c),x=>CC[x.k])}</div>
  <div class="card"><h2>Top positions</h2>${top.map(h=>`<div class="r">${av(h)}<div class="g"><b>${esc(h.n)}</b><div class="bar"><i style="width:${val(h)/T*100}%;background:${CC[h.c]}"></i></div></div><div class="rt"><b>${eur(val(h))}</b><div class="mut">${(val(h)/T*100).toFixed(1)}%</div></div></div>`).join('')}</div>
  <div class="card"><h2>By account</h2>${group(S.h,h=>h.a).map((x,i)=>`<div style="margin-bottom:12px"><div class="sp"><span>${esc(x.k)}</span><b>${eur(x.v)}</b></div><div class="bar"><i style="width:${x.v/T*100}%;background:${COL[i%8]}"></i></div></div>`).join('')}</div>`;
},
Assets(){
  const T=total(),L=S.h.filter(h=>flt==='All'||h.c===flt).sort((a,b)=>val(b)-val(a));
  return `<div class="chips">${['All',...CATS].map(c=>`<button class="chip ${c===flt?'on':''}" onclick="flt='${c}';render()">${c}</button>`).join('')}</div>
  <div class="card"><div class="sp" style="margin-bottom:6px"><h2>${L.length} holdings</h2>${window.refresh?'<button class="chip" onclick="run(refresh)">↻ Refresh</button>':''}</div>${L.length?L.map(h=>`<div class="r">${av(h)}<div class="g" onclick="hs('${h.id}')"><b>${esc(h.n)}</b><div class="mut">${h.c} · ${esc(h.a)} · ${num(h.q)} × ${sym(h.cur)}${num(h.p)}</div></div><div class="rt"><b>${eur(val(h))}</b><div class="mut">${T?(val(h)/T*100).toFixed(1):0}%</div></div><button class="ib" onclick="hs('${h.id}')" aria-label="Edit">✎</button><button class="ib" onclick="delH('${h.id}')" aria-label="Delete">✕</button></div>`).join(''):'<p class="mut">Nothing here yet. Tap + to add an asset.</p>'}</div>
  <div class="card"><h2>Backup</h2><textarea id="bk" rows="3" placeholder="Paste a backup here to restore"></textarea><div class="f" style="margin-top:10px"><button class="btn g" onclick="$('bk').value=JSON.stringify(S)">Show backup</button><button class="btn g" onclick="restore()">Restore</button></div></div>`;
},
'Cash flow'(){
  const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms.push(d.toISOString().slice(0,7))}
  const sum=(m,ty)=>S.t.filter(x=>x.d.startsWith(m)&&x.ty===ty).reduce((a,x)=>a+tv(x),0),cm=ms[5],inc=sum(cm,'in'),exp=sum(cm,'out'),mx=Math.max(1,...ms.flatMap(m=>[sum(m,'in'),sum(m,'out')]));
  const cash=S.h.filter(h=>h.c==='Cash'),cats={};S.t.filter(x=>x.ty==='out'&&x.d.startsWith(cm)).forEach(x=>cats[x.c||'Other']=(cats[x.c||'Other']||0)+tv(x));
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),nm=h=>S.h.find(z=>z.id===h);
  return `<div class="tiles">${tile('Income',eur(inc),'pos')}${tile('Expenses',eur(exp),'neg')}${tile('Net',eur(inc-exp),inc-exp>=0?'pos':'neg')}</div>
  <div class="card"><h2>Last 6 months</h2><div class="mb">${ms.map(m=>`<div><div class="p"><i style="height:${sum(m,'in')/mx*100}%;background:var(--pos)"></i><i style="height:${sum(m,'out')/mx*100}%;background:var(--neg)"></i></div><span class="mut">${new Date(m+'-01').toLocaleString('en',{month:'short'})}</span></div>`).join('')}</div></div>
  ${cl.length?`<div class="card"><h2>Spending this month</h2>${cl.map(([c,v],i)=>`<div style="margin-bottom:10px"><div class="sp"><span>${esc(c)}</span><b>${eur(v)}</b></div><div class="bar"><i style="width:${v/exp*100}%;background:${COL[i%8]}"></i></div></div>`).join('')}</div>`:''}
  <div class="card"><h2>Cash accounts</h2>${cash.length?cash.map(h=>{const m=S.t.filter(x=>x.k===h.id&&x.d.startsWith(cm)),i=m.filter(x=>x.ty==='in').reduce((a,x)=>a+tv(x),0),o=m.filter(x=>x.ty==='out').reduce((a,x)=>a+tv(x),0);return `<div class="r">${av(h)}<div class="g"><b>${esc(h.n)}</b><div class="mut">${esc(h.a)} · <span class="pos">+${eur(i)}</span> <span class="neg">-${eur(o)}</span></div></div><b>${eur(val(h))}</b></div>`}).join(''):'<p class="mut">Add an asset with the Cash type to link transactions to it.</p>'}</div>
  <div class="card"><h2>Recent transactions</h2>${S.t.length?S.t.map((x,i)=>({...x,i})).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,20).map(x=>`<div class="r"><div class="av" style="background:${x.ty==='in'?'#34d39922':'#fb718522'};color:${x.ty==='in'?'var(--pos)':'var(--neg)'}">${x.ty==='in'?'↓':'↑'}</div><div class="g"><b>${esc(x.c||'Other')}</b><div class="mut">${x.d}${x.n?' · '+esc(x.n):''}${nm(x.k)?' · '+esc(nm(x.k).n):''}</div></div><b class="${x.ty==='in'?'pos':'neg'}">${x.ty==='in'?'+':'-'}${eur(tv(x))}</b><button class="ib" onclick="delT(${x.i})" aria-label="Delete">✕</button></div>`).join(''):'<p class="mut">No transactions yet. Tap + to add one.</p>'}</div>`;
}};
function render(){
  $('nav').innerHTML=Object.keys(V).map(k=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)"><span>${ICON[k]||'•'}</span>${k}</button>`).join('');
  $('app').innerHTML=head()+V[tab]();$('fab').style.display=tab==='Connect'?'none':'block';
}
function hs(id){
  const h=S.h.find(x=>x.id===id)||{};E=id||null;if(typeof pick!=='undefined')pick=null;
  sheet(`<h3>${id?'Edit holding':'Add holding'}</h3>${!id&&window.sq?'<input placeholder="🔍 Search WBTC, NVDA, Bitcoin, OPAP…" oninput="sq(this.value)"><div id="sr" style="margin-bottom:10px"></div>':''}
  <div class="f"><input id="hn" class="full" placeholder="Name (e.g. NVDA, SOL, Checking)" value="${esc(h.n||'')}"><select id="hc">${opts(CATS,h.c)}</select><select id="ha">${opts(ACCS,h.a)}</select>
  <input id="hq" type="number" step="any" placeholder="Quantity" value="${h.q!==undefined&&h.c!=='Cash'?h.q:''}"><input id="hp" type="number" step="any" placeholder="${h.src?'Live price':'Price per unit'}" value="${h.p??''}"${h.src?' readonly':''}><select id="hu" class="full">${opts(['USD','EUR'],h.cur)}</select>
  <div class="full mut">For Cash, enter the balance as the price. Quantity is set to 1 automatically.</div><button class="btn full" onclick="addH()">Save</button></div>`);
}
function addH(){
  const n=$('hn').value.trim(),c=$('hc').value,p=parseFloat($('hp').value);let q=parseFloat($('hq').value);if(c==='Cash')q=1;
  if(!n||isNaN(q)||isNaN(p))return toast('Please fill in name, quantity and price');
  const o={n,c,a:$('ha').value,q,p,cur:$('hu').value};
  if(E)Object.assign(S.h.find(h=>h.id===E),o);else S.h.push({id:uid(),...o});
  E=null;closeSheet();save();
}
function delH(id){ask('Delete this holding?',()=>{S.h=S.h.filter(h=>h.id!==id);save()})}
function ts(){
  const cash=S.h.filter(h=>h.c==='Cash');
  sheet(`<h3>Add transaction</h3><div class="f"><select id="tt"><option value="out">Expense</option><option value="in">Income</option></select><input id="ta" type="number" step="any" placeholder="Amount"><select id="tu"><option>EUR</option><option>USD</option></select><select id="tc">${opts(TC)}</select>
  <input id="tn" class="full" placeholder="Note (optional)"><input id="td" type="date" value="${today()}"><select id="tk"><option value="">No linked account</option>${cash.map(h=>`<option value="${h.id}">${esc(h.n)} (${esc(h.a)})</option>`).join('')}</select><button class="btn full" onclick="addT()">Save</button></div>`);
}
function addT(){
  const a=parseFloat($('ta').value);if(isNaN(a))return toast('Please enter an amount');
  const x={ty:$('tt').value,a,cur:$('tu').value,c:$('tc').value,n:$('tn').value.trim(),d:$('td').value||today(),k:$('tk').value};
  const h=S.h.find(h=>h.id===x.k);
  if(h){x.hd=(h.cur==='USD'?tv(x)/S.fx:tv(x))*(x.ty==='in'?1:-1);h.p=Math.round((h.p+x.hd)*100)/100}
  S.t.push(x);closeSheet();save();
}
function delT(i){ask('Delete this transaction?',()=>{const x=S.t[i],h=x&&S.h.find(h=>h.id===x.k);if(h&&x.hd)h.p=Math.round((h.p-x.hd)*100)/100;S.t.splice(i,1);save()})}
function restore(){try{const o=JSON.parse($('bk').value);if(o.h&&o.t){S=Object.assign({h:[],t:[],s:[],fx:0.9,disp:'EUR'},o);save()}}catch(e){toast('That backup could not be read')}}
